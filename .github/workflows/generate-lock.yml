name: Generate package-lock.json
on: workflow_dispatch

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - uses: actions/upload-artifact@v4
        with:
          name: lockfile
          path: package-lock.json
